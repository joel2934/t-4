<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PulseCheck — Live Poll</title>
<style>
  :root {
    --purple: #6d5bff;
    --purple-dark: #5643e0;
    --teal: #17c3b2;
    --text: #1b1f2a;
    --muted: #6b7280;
    --bar-colors: #6d5bff, #17c3b2, #ff6b6b, #ffb020;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 20% 20%, #2a2154, transparent 55%),
                radial-gradient(circle at 80% 30%, #123a4a, transparent 55%),
                linear-gradient(160deg, #14142b, #1b1035 60%, #0f1a2b);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 14px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.97);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 0 0 rgba(23,195,178,0.6);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(23,195,178,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(23,195,178,0); }
    100% { box-shadow: 0 0 0 0 rgba(23,195,178,0); }
  }
  .brand span.name { font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
  .brand span.tag { font-size: 11.5px; color: var(--muted); }

  h1 {
    font-size: 19px;
    margin: 0 0 20px;
    line-height: 1.35;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    text-align: left;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1.5px solid #e4e2f5;
    background: #f7f7fc;
    color: var(--text);
    font-size: 14.5px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.05s;
  }
  .option-btn:hover { border-color: var(--purple); background: #f0eeff; }
  .option-btn:active { transform: scale(0.99); }
  .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }

  .results { display: none; flex-direction: column; gap: 16px; }
  .results.visible { display: flex; }

  .result-row .label {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    margin-bottom: 6px;
  }
  .result-row .label .count { color: var(--muted); font-weight: 600; }
  .bar-track {
    background: #eef0f6;
    border-radius: 999px;
    height: 22px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    width: 0%;
    transition: width 0.5s ease;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 8px;
  }
  .bar-fill .pct {
    color: white;
    font-size: 11px;
    font-weight: 700;
  }

  .total-votes {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 4px;
  }

  .voted-check {
    text-align: center;
    font-size: 13px;
    color: var(--teal);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .reset-row { text-align: center; margin-top: 22px; }
  .reset-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11.5px;
    text-decoration: underline;
    cursor: pointer;
  }
  .reset-btn:hover { color: var(--purple); }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <span class="dot"></span>
    <span class="name">PulseCheck</span>
    <span class="tag">· live poll, backed by Azure SQL Database</span>
  </div>

  <h1 id="question">Loading question…</h1>

  <div class="options" id="optionsContainer"></div>

  <div class="results" id="resultsContainer">
    <div class="voted-check">✓ Your vote is in — here's what the room is thinking</div>
    <div id="resultRows"></div>
    <div class="total-votes" id="totalVotes"></div>
  </div>

  <div class="reset-row">
    <button class="reset-btn" onclick="resetPoll()">Instructor: reset poll for a new question</button>
  </div>
</div>

<script>
const barColors = ["#6d5bff", "#17c3b2", "#ff6b6b", "#ffb020"];
let hasVoted = false;
let pollTimer = null;
let currentOptions = [];

async function loadPoll() {
  const res = await fetch("/poll");
  const data = await res.json();
  currentOptions = data.options;

  document.getElementById("question").textContent = data.question;

  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  data.options.forEach((opt) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = opt;
    btn.onclick = () => castVote(opt, btn);
    container.appendChild(btn);
  });
}

async function castVote(option, btnEl) {
  if (hasVoted) return;
  hasVoted = true;

  document.querySelectorAll(".option-btn").forEach((b) => (b.disabled = true));

  const formData = new FormData();
  formData.append("option", option);
  await fetch("/vote", { method: "POST", body: formData });

  showResults();
}

function showResults() {
  document.getElementById("optionsContainer").style.display = "none";
  const resultsEl = document.getElementById("resultsContainer");
  resultsEl.classList.add("visible");

  refreshResults();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshResults, 1500);
}

async function refreshResults() {
  const res = await fetch("/results");
  const data = await res.json();
  const rowsEl = document.getElementById("resultRows");
  rowsEl.innerHTML = "";

  currentOptions.forEach((opt, i) => {
    const count = data.counts[opt] || 0;
    const pct = data.total ? Math.round((count / data.total) * 100) : 0;
    const color = barColors[i % barColors.length];

    const row = document.createElement("div");
    row.className = "result-row";
    row.innerHTML = `
      <div class="label">
        <span>${opt}</span>
        <span class="count">${count} vote${count === 1 ? "" : "s"}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%; background:${color};">
          <span class="pct">${pct > 8 ? pct + "%" : ""}</span>
        </div>
      </div>
    `;
    rowsEl.appendChild(row);
  });

  document.getElementById("totalVotes").textContent =
    `${data.total} total vote${data.total === 1 ? "" : "s"} so far`;
}

async function resetPoll() {
  if (!confirm("Reset all votes and start this poll over?")) return;
  await fetch("/reset", { method: "POST" });
  hasVoted = false;
  if (pollTimer) clearInterval(pollTimer);
  document.getElementById("resultsContainer").classList.remove("visible");
  document.getElementById("optionsContainer").style.display = "flex";
  document.querySelectorAll(".option-btn").forEach((b) => (b.disabled = false));
}

loadPoll();
</script>

</body>
</html>
